[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "0.1.0"
description = "Local Retrieval-Augmented Generation over one folder. Private, offline, runs on your Mac."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "RUF", "PERF", "BLE"]
# B008: FastAPI's Depends() in a default argument is the idiomatic pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
